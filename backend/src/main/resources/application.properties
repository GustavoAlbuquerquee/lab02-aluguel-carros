spring.application.name=aluguel
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:aluguel;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.web.error.include-message=always
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
